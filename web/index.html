<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flik · Presentation preview</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="toolbar">
    <div class="identity">
      <span class="brand">FLIK</span>
      <h1 id="deck-title">Presentation preview</h1>
    </div>
    <div id="talk-timer" class="actions" aria-label="Talk timer" hidden>
      <span id="elapsed" role="timer" aria-label="Elapsed time">00:00:00</span>
      <button id="timer-toggle" type="button">Start</button>
      <button id="timer-reset" type="button" disabled>Reset</button>
    </div>
    <div id="preview-actions" class="actions">
      <button id="export-pdf" type="button" disabled>Export PDF</button>
      <button id="present" type="button" aria-keyshortcuts="F" disabled>Present <kbd>F</kbd></button>
    </div>
  </header>
  <main class="workspace">
    <div id="stage" class="stage" aria-label="Slide preview">
      <div id="frame" class="frame" hidden>
        <article id="slide" class="slide" aria-label="Current slide"></article>
      </div>
      <p id="placeholder" role="status">Loading presentation…</p>
    </div>
    <section id="speaker-notes" aria-labelledby="notes-heading" hidden>
      <h2 id="notes-heading">Speaker notes</h2>
      <div id="notes-text" tabindex="0" role="region" aria-labelledby="notes-heading">Loading notes…</div>
    </section>
    <section id="upcoming" aria-labelledby="upcoming-heading" hidden>
      <h2 id="upcoming-heading">Next slide</h2>
      <div id="next-stage" class="stage">
        <div id="next-frame" class="frame" hidden>
          <article id="next-slide" class="slide" aria-label="Next slide preview" inert></article>
        </div>
        <p id="next-placeholder">Loading presentation…</p>
      </div>
    </section>
  </main>
  <footer class="toolbar footer">
    <nav aria-label="Slide navigation">
      <button id="previous" type="button" aria-keyshortcuts="ArrowLeft" disabled>← <span>Previous</span></button>
      <output id="position" aria-live="polite">0 / 0</output>
      <button id="next" type="button" aria-keyshortcuts="ArrowRight Space" disabled><span>Next</span> →</button>
    </nav>
    <div class="messages">
      <p id="warning" role="status" hidden>Slide overflows. Some content is clipped.</p>
      <p id="error" role="alert" hidden></p>
    </div>
  </footer>
  <div id="print-deck"></div>
</body>
</html>
